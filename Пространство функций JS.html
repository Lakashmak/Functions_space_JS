    <script>
        class Complex {
            constructor(Re, Im) {
                if (arguments.length === 1 && typeof Re === 'object') { // Если передан объект Complex
                    this.Re = Re.Re;
                    this.Im = Re.Im;
                } else if (arguments.length === 2) { // Если переданы два числа
                    this.Re = Re;
                    this.Im = Im;
                } else if (arguments.length === 1 && typeof Re === 'number') { // Если передано одно число
                    this.Re = Re;
                    this.Im = 0;
                } else {
                    throw new Error('Invalid arguments');
                }
            }

            Abs() { // |z| модуль (абсолютное значение)
                return Math.sqrt(this.Re * this.Re + this.Im * this.Im);
            }

            static Abs(a) { // |z| модуль (абсолютное значение)
                if (typeof a === 'number') {
                    return Math.abs(a);
                } else if (a instanceof Complex) {
                    return Math.sqrt(a.Re * a.Re + a.Im * a.Im);
                }
                throw new Error('Invalid argument');
            }

            Sign() { // sign(z) направление
                if (this.Re === 0 && this.Im === 0) return new Complex(1);
                else return new Complex(this.Re, this.Im).Div(new Complex(this.Re, this.Im).Abs());
            }

            static Sign(a) { // sign(z) направление
                if (typeof a === 'number') {
                    return a === 0 ? 1 : Math.sign(a);
                } else if (a instanceof Complex) {
                    if (a.Re === 0 && a.Im === 0) return new Complex(1);
                    else return a.Div(a.Abs());
                }
                throw new Error('Invalid argument');
            }

            Conj() { // conj(z) комплексносопряжённое (Re(z) - Im(z))
                return new Complex(this.Re, -this.Im);
            }

            static Conj(a) { // conj(z) комплексносопряжённое (Re(z) - Im(z))
                if (typeof a === 'number') {
                    return new Complex(a);
                } else if (a instanceof Complex) {
                    return new Complex(a.Re, -a.Im);
                }
                throw new Error('Invalid argument');
            }

            Sum(b) { // + сложение
                if (typeof b === 'number') {
                    return new Complex((this.Re + b), this.Im);
                } else if (b instanceof Complex) {
                    return new Complex((this.Re + b.Re), (this.Im + b.Im));
                }
                throw new Error('Invalid argument');
            }

            static Sum(a, b) { // + сложение
                if (typeof a === 'number' && typeof b === 'number') {
                    return a + b;
                } else if (a instanceof Complex && typeof b === 'number') {
                    return new Complex((a.Re + b), a.Im);
                } else if (typeof a === 'number' && b instanceof Complex) {
                    return new Complex((a + b.Re), b.Im);
                } else if (a instanceof Complex && b instanceof Complex) {
                    return new Complex((a.Re + b.Re), (a.Im + b.Im));
                }
                throw new Error('Invalid arguments');
            }

            Sub(b) { // - вычитание
                if (typeof b === 'number') {
                    return new Complex((this.Re - b), this.Im);
                } else if (b instanceof Complex) {
                    return new Complex((this.Re - b.Re), (this.Im - b.Im));
                }
                throw new Error('Invalid argument');
            }

            static Sub(a, b) { // - вычитание
                if (typeof a === 'number' && typeof b === 'number') {
                    return a - b;
                } else if (a instanceof Complex && typeof b === 'number') {
                    return new Complex((a.Re - b), a.Im);
                } else if (typeof a === 'number' && b instanceof Complex) {
                    return new Complex((a - b.Re), -b.Im);
                } else if (a instanceof Complex && b instanceof Complex) {
                    return new Complex((a.Re - b.Re), (a.Im - b.Im));
                }
                throw new Error('Invalid arguments');
            }

            Mul(b) { // * умножение
                if (typeof b === 'number') {
                    return new Complex((this.Re * b), (this.Im * b));
                } else if (b instanceof Complex) {
                    return new Complex((this.Re * b.Re - this.Im * b.Im), (this.Re * b.Im + this.Im * b.Re));
                }
                throw new Error('Invalid argument');
            }
            
            static Mul(a, b) { // * умножение
                if (typeof a === 'number' && typeof b === 'number') {
                    return a * b;
                } else if (a instanceof Complex && typeof b === 'number') {
                    return new Complex((a.Re * b), (a.Im * b));
                } else if (typeof a === 'number' && b instanceof Complex) {
                    return new Complex((a * b.Re), (a * b.Im));
                } else if (a instanceof Complex && b instanceof Complex) {
                    return new Complex((a.Re * b.Re - a.Im * b.Im), (a.Re * b.Im + a.Im * b.Re));
                }
                throw new Error('Invalid arguments');
            }

            Div(b) { // / деление
                if (typeof b === 'number') {
                    return new Complex((this.Re / b), (this.Im / b));
                } else if (b instanceof Complex) {
                    const c = this.Mul(b.Conj());
                    const denominator = (b.Re * b.Re + b.Im * b.Im);
                    return new Complex((c.Re / denominator), (c.Im / denominator));
                }
                throw new Error('Invalid argument');
            }

            static Div(a, b) { // / деление
                if (typeof a === 'number' && typeof b === 'number') {
                    return a / b;
                } else if (a instanceof Complex && typeof b === 'number') {
                    return new Complex((a.Re / b), (a.Im / b));
                } else if (typeof a === 'number' && b instanceof Complex) {
                    const c = a * b.Conj();
                    const denominator = (b.Re * b.Re + b.Im * b.Im);
                    return new Complex((c / denominator), 0); // Упрощаем для случая с числом
                } else if (a instanceof Complex && b instanceof Complex) {
                    const c = a.Mul(b.Conj());
                    const denominator = (b.Re * b.Re + b.Im * b.Im);
                    return new Complex((c.Re / denominator), (c.Im / denominator));
                }
                throw new Error('Invalid arguments');
            }

            Arg() { // угол направления числа
            return Math.acos(this.Sign().Re) * this.Sign(Math.asin(this.Sign().Im));
            }

            static Arg(a) { // угол направления числа
                if(typeof a == "number") 
                    return Math.acos(this.Sign(a));
                else 
                    return Math.acos(this.Sign(a).Re)*this.Sign(Math.asin(this.Sign(a).Im)); 
            }

            Drct() { // числовое направление угла
                return this.Sum(Complex.Cos(), this.Mul(Complex.Sin(), new Complex(0, 1)));
            }

            static Drct(a) { // числовое направление угла
                return new Complex(Math.cos(a), Math.sin(a));
            }

            Exp(b) { // ^ возведение в степень через предел
                const c = new Complex(this.Re, this.Im);
                let result = new Complex(1);

                for(let i = 0; i < Math.abs(b); i++) {
                    result = result.Mul(c);
                }
                
                if(b < 0)
                    result = result.Div(c);

                return result;
            }

            static Exp(a, n){
                let c = 1;
                for(let i=0; i<Math.abs(n); i++) {
                c *= a;
                }
                c /= n < 0 ? Math.pow(a,n):1; 
                return c;
            }

            Pow(b){ // ^ возведение в степень
                const c = Math.pow(this.Abs(),b); 
                const d = this.Drct(this.Angle()*b); 
                return this.Mul(c,d); 
            }
            
            static Pow(a,b){ // ^ возведение в степень
                let c1 = Math.pow(Abs(a),b); 
                let c2 = Drct(Angle(a)*b); 
                let c3 = Mul(Math.pow(Math.E,-b*Angle(c2)),Drct(Math.log(Math.abs(c2))*b)); 
                let c4 = Math.pow(Math.E,-b*Angle(c3)); 
                let c5 = Mul(Mul(c1,c2),Mul(c3,c4)); 
                return c5; 
            }
            
            Ln() { // ln() натуральный логарифм через предел
                const c1 = this.Mul(Math.pow(this.Abs(), Math.pow(0.1, d)), this.Drct(this.Angle() * Math.pow(0.1, d)));
                const c2 = this.Mul(Math.pow(10, d), this.Sub(c1, 1));

                return c2;
            }

            Log(b){ // log() логарифм
                const c = this.Ln();
                const d = Ln(b);

                return this.Div(c,d); 
            }
            
            Sin() { // sin() синус
                const e = Math.E; 
                const f = Mul(new complex(Re,Im),new complex(0,1)); 
                const g = Sub(Pow(e,f),Pow(e,Mul(new complex(Re,Im),new complex(0,-1)))); 

                return Div(g,new complex(0,2)); 
            }
            
            Cos() { // cos() косинус
                const e = Math.E; 
                const f = Mul(new complex(Re,Im),new complex(0,-1));
                const g = Sum(Pow(e,f),Pow(e,Mul(new complex(Re,Im),new complex(0,-1)))); 

                return Div(g,new complex(2)); 
            }
        
            Tan() { // tg() тангенс
                const e = new complex(Re,Im); 

                return Div(Sin(e),Cos(e)); 
            }
        }

        let operations = [];
        function Recognition(formula) {
            formula = String(formula);
            let multiexpression=false, And=false, Abs=false, equality=false, Sum=false, Sub=false, Mul=false, Div=false, Pow=false;
            {
                let level = 0, formula1 = "";
                for (let i = 0; i < formula.length; i++) {
                    if (formula[i] == '(') level++;
                    else if(formula[i] == ')') level--;
                    if(formula[i]=='\n') multiexpression = true;
                    if(level <= 0 && ['=', '>', '<'].includes(formula[i])) equality = true;
                    if(level <= 0 && !Sub && formula[i] == '+') Sum = true;
                    if(level <= 0 && !Sum && formula[i] == '-') Sub = true;
                    if(level <= 0 && !Div && formula[i] == '*') Mul = true;
                    if(level <= 0 && !Mul && formula[i] == '/') Div = true;
                    if(level <= 0 && formula[i] == '^') Pow = true;
                    if(level <= 0 && formula[i] == '|') Abs = true;
                    if(level <= 0 && formula[i] == '&') And = true;
                    //if(formula[i] != ' ') formula1 += formula[i];
                } //formula = formula1;
            }

            if (multiexpression) {
                formula1 = "Mex(";
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] != '\n') formula1 += String(formula[i]);
                    else formula1 += ";";
                }
                formula1 += ")";
                formula = formula1;
            } else if (Abs) {
                let Open = false, level = 0, formula1 = "(";
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0 || formula[i] != '|') formula1 += String(formula[i]);
                    else if (formula[i] == '|') {
                        if (!Open) formula1 += "Abs(";
                        else formula1 += ")";
                        Open = !Open;
                    }
                }
                formula1 += ")";
                formula = formula1;
            } else if (And) {
                let level = 0, formula1 = "Max(";
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0 || formula[i] != '&') formula1 += String(formula[i]);
                    else formula1 += ";";
                }
                formula1 += ")";
                formula = formula1;
            } else if (equality) {
                //bool larger = false;
                //bool less = false;
                let level = 0, formula1 = "Max(", args = [], types = "", arg = "";
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level >= 0) {
                        if (level > 0 || formula[i] != '=' && formula[i] != '>' && formula[i] != '<') arg += formula[i];
                        else if (formula[i] == '=' || formula[i] == '>' || formula[i] == '<') {
                            //if (formula[i] == '>') larger = true;
                            //if (formula[i] == '<') less = true;
                            //formula1 += ";";
                            types += String(formula[i]);
                            args.push(arg);
                            arg = "";
                        }
                    }
                }
                args.push(arg);
                for (let i = 0; i < types.Length; i++) {
                    if (types[i] == '=') formula1 += "Eq(" + args[i] + ";" + args[i + 1] + ")";
                    if (types[i] == '>') formula1 += "Lar(" + args[i] + ";" + args[i + 1] + ")";
                    if (types[i] == '<') formula1 += "Les(" + args[i] + ";" + args[i + 1] + ")";
                    if (i + 1 < types.Length) formula1 += ";";
                }
                formula1 += ")";
                formula = formula1;
            } else if (Sum || Sub) {
                let formula1 = ""; if (Sum) formula1 = "Sum("; if (Sub) formula1 = "Sub(";
                let level = 0, one = true;
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0 || formula[i] != '+' && formula[i] != '-') formula1 += String(formula[i]);
                    else if (one) { formula1 += ";"; one = false; }
                    else {
                        if (formula[i] == '+') formula1 = "Sum(" + formula1 + ");";
                        if (formula[i] == '-') formula1 = "Sub(" + formula1 + ");";
                    }
                }
                formula1 += ")";
                formula = formula1;
            } else if (Mul || Div) {
                let formula1 = ""; if (Mul) formula1 = "Mul("; if (Div) formula1 = "Div(";
                let level = 0, one = true;
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0 || formula[i] != '*' && formula[i] != '/') formula1 += formula[i];
                    else if (one) { formula1 += ";"; one = false; }
                    else {
                        if (formula[i] == '*') formula1 = "Mul(" + formula1 + ");";
                        if (formula[i] == '/') formula1 = "Div(" + formula1 + ");";
                    }
                }
                formula1 += ")";
                formula = formula1;
            } else if (Pow) {
                let level = 0, formula1 = "", one = true;
                for (let i = 0; i < formula.Length; i++) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0 || !one || formula[i] != '^') formula1 += formula[i];
                    else if (formula[i] == '^') { formula1 = "Pow(" + formula1 + ";"; one = false; }
                }
                formula1 += ")";
                formula = formula1;
            }

            while (formula != "") {
                let i = 0, operation = "";
                while (i < formula.Length && formula[i] != '(') operation += String(formula[i++]);
                if (i >= formula.Length) break;
                let level = 1, arguments = "";
                i++;
                while (i < formula.Length && level > 0) {
                    if (formula[i] == '(') level++;
                    else if (formula[i] == ')') level--;
                    if (level > 0) arguments += String(formula[i++]);
                }
                if (i >= formula.Length || arguments == "") break;
                args = [];
                {
                    let arg = "", level = 0;
                    for (let j = 0; j < arguments.Length; j++) {
                        if (arguments[j] == '(') level++;
                        else if (arguments[j] == ')') level--;
                        if (level >= 0) {
                            if (level > 0 || arguments[j] != ';') arg += String(arguments[j]);
                            else {
                                args.push(arg);
                                arg = "";
                            }
                        }
                    }
                    args.push(arg);
                }
                for (let j = 0; j < args.Count; j++) args[j] = Recognition(args[j]);
                if (operation == "Sum" || operation == "Sub") for (let j = 0; j < args.Count; j++) if (args[j] == "") args[j] = "0";
                {
                    let j = 0;
                    for (; j < operations.Count; j++) if (operations[j].name == operation && operations[j].args == args) break;
                    if (j >= operations.Count) operations.push(new Operation(operation, args));
                    let formula1 = "r" + (j);
                    i++;
                    while (i < formula.Length) formula1 += String(formula[i++]);
                    formula = formula1;
                }
            }
            return String(formula); 
        }

        function CalculationValue(value) {
            value = String(value);
            if (value == "") return new Complex(1);
            if (value[0] == 'r') {
                let id = ""; for (let i = 1; i < value.Length; i++) id += value[i];
                const op = operations[Math.floor(id)];
                sargs = op.args;
                args = [];
                sargs.forEach(function(arg) { args.push(CalculationValue(arg)); });

                if (op.name == "") return new Complex(args[0]);
                if (op.name == "Eq") {
                    return new Complex(args[0].Sub(args[1]).Abs());
                }
                if (op.name == "Lar") { //if (larger) formula1 = "Div(Sub(" + formula1 + ";Abs(" + formula1 + "));2)";
                    let result = args[0].Sub(args[1]).Re;
                    if (result > 0) result = 0;
                    return new Complex(Math.Abs(result));
                }
                if (op.name == "Les") { //if (less) formula1 = "Div(Sum(" + formula1 + ";Abs(" + formula1 + "));2)";
                    let result = args[0].Sub(args[1]).Re;
                    if (result < 0) result = 0;
                    return new Complex(Math.Abs(result));
                }
                if (op.name == "Mex") {
                    let result = args[0].Abs();
                    for (let i = 1; i < args.Count; i++) if ((args[i].Abs() < result || !(args[i].Abs() > result)) && (args[i].Abs() >= 0 || args[i].Abs() <= 0)) result = args[i].Abs();
                    return new Complex(result);
                }
                if (op.name == "Complex") return new Complex(args[0].Re, args[1].Re);
                if (op.name == "Re") return new Complex(args[0].Re);
                if (op.name == "Im") return new Complex(args[0].Im);
                if (op.name == "Min" || op.name == "min") { //if (Math.Abs(b) < Math.Abs(a) || !(Math.Abs(b) > Math.Abs(a)) && (b >= 0 || b <= 0)) a = b;
                    let result = args[0].Re;
                    for (let i = 1; i < args.Count; i++) if ((args[i].Re < result || !(args[i].Re > result)) && (args[i].Re >= 0 || args[i].Re <= 0)) result = args[i].Re;
                    return new Complex(result);
                }
                if (op.name == "Max" || op.name == "max") {
                    let result = args[0].Re;
                    for (let i = 1; i < args.Count; i++) if ((args[i].Re > result || !(args[i].Re < result)) && (args[i].Re >= 0 || args[i].Re <= 0)) result = args[i].Re;
                    return new Complex(result);
                }
                if (op.name == "Abs" || op.name == "abs") return new Complex(args[0].Abs());
                if (op.name == "Sign" || op.name == "sign" || op.name == "sgn") return args[0].Sign();
                if (op.name == "Conj" || op.name == "conj") return args[0].Conj();
                if (op.name == "Sum" || op.name == "sum") {
                    let result = new Complex(args[0]);
                    for (let i = 1; i < args.Count; i++) result = result.Sum(args[i]);
                    return result;
                }
                if (op.name == "Sub" || op.name == "sub") return args[0].Sub(args[1]);
                if (op.name == "Mul" || op.name == "mul") {
                    let result = new Complex(args[0]);
                    for (let i = 1; i < args.Count; i++) result = result.Mul(args[i]);
                    return result;
                }
                if (op.name == "Div" || op.name == "div") return args[0].Div(args[1]);
                if (op.name == "Arg" || op.name == "arg" || op.name == "Angle" || op.name == "angle") return new Complex(args[0].Arg()); 
                if (op.name == "Drct" || op.name == "drct") return args[0].Drct();
                if (op.name == "Exp" || op.name == "exp") return new Complex(Math.E).Pow(args[0]);
                if (op.name == "Pow" || op.name == "pow") return args[0].Pow(args[1]);
                if (op.name == "Ln" || op.name == "ln") return args[0].Ln();
                if (op.name == "Log" || op.name == "log") return args[0].Log(args[1]);
                if (op.name == "Sin" || op.name == "sin") return args[0].Sin();
                if (op.name == "Cos" || op.name == "cos") return args[0].Cos();
                if (op.name == "Tan" || op.name == "tan" || op.name == "tg") return args[0].Tan();
                if (op.name == "Ctg" || op.name == "ctg") return new Complex(1).Div(args[0].Tan());
                if (op.name == "Sec" || op.name == "sec") return new Complex(1).Div(args[0].Cos());
                if (op.name == "Csc" || op.name == "csc" || op.name == "cosec") return new Complex(1).Div(args[0].Sin());
            }

            else if (value[0] == 'c') return c;
            else if (value[0] == 'x') return new Complex(c.Re);
            else if (value[0] == 'y') return new Complex(c.Im);
            else if (value[0] == 't') return new Complex(t);
            else if (value[0] == 'p') return new Complex(Math.PI);
            else if (value[0] == 'e') return new Complex(Math.E);
            else if (value[0] == 'i') return new Complex(0, 1);

            return new Complex(parseFloat(value));
        }

        function Calculation(c) {
            var i = 1;
            try {
                //для написания функции
                // i = 0 = f(x, y)
                // c.Re = x
                // c.Im = y
                i = CalculationValue(Fvalue).Abs(); //Sub(y; Sin(Mul(t; x)))
                i = c.Sub(new Complex(0, 2)).Abs() - 2;
                dt = 0.025; //скорость анимации
                if (c.Re > sx - m / k && c.Re < sx + m / k && c.Im < -sy + m / k && c.Im > -sy - m / k) dist = i; //вывод расстояния до функции
            } catch { }
            if (i == 0) return 'rgb(0, 0, 0)';
            else {
                i = Math.abs(i);
                i = Math.log(i,2);
                
                if (i >= 0 || i <= 0) try {
                    let r = Math.floor((127 - Math.floor(255.0 * (Math.cos(i / 5.0 + 3.0 * Math.PI / 3.0)) + 0.0) / 1.0 * 1.0) / 1); if (r > 255) r = 255; if (r < 0) r = 0;
                    let g = Math.floor((127 - Math.floor(255.0 * (Math.cos(i / 5.0 + 5.0 * Math.PI / 3.0)) + 0.0) / 1.0 * 1.0) / 1); if (g > 255) g = 255; if (g < 0) g = 0;
                    let b = Math.floor((127 - Math.floor(255.0 * (Math.cos(i / 5.0 + 1.0 * Math.PI / 3.0)) + 0.0) / 1.0 * 1.0) / 1); if (b > 255) b = 255; if (b < 0) b = 0;
                    return `rgb(${r}, ${g}, ${b})`;
                }
                catch { return 'rgb(255, 0, 255)'; }
                else { return 'rgb(255, 255, 0)'; }
            }
        }
