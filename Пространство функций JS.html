<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пространство функций</title>
    <link rel='icon' type='image/x-icon' href = 'assets/img/Functions_space_logo.ico' id='linkicon'>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body> <!--<body onload="draw();">-->
    <!--<canvas id="drawing" width="930" height="900">Ошибка</canvas>-->
    
    <canvas id="pictureBox1" width="800" height="450"></canvas>
    
    <div id="info">
        <div id="label3" style="display: none">FPS: 0</div>
        <div id="label2">Масштаб: 5
            <br>x: 0
            <br>y: 0
            <br>t: 0
        </div> <!-- label2 -->
    </div> <!-- info -->
    
    <div id="controls">
        <button id="button10">+</button><br>
        <button id="button11">–</button>
    </div>
    
    <div class="toolbar">
        <button id="button4">Меню</button>
        <button id="button6">Анимация</button>
    </div>
    
    <div id="menu">
        <div id="menuToolbar">
            <button id="button5">Скрыть</button>
            <button id="button1">Анимация</button>
            <div id="stretchArea"></div>
        </div>
        <div class="menuWindow">
            <div class="tabs">
                <button id="button7" class="menuTabBtn">Выражение</button>
                <button id="button8" class="menuTabBtn">Положение</button>
                <button id="button9" class="menuTabBtn">Настройки</button>
                <button id="button13" class="menuTabBtn">Калькулятор</button>
            </div>
            
            <div class="menuSlider">
                <div id="groupBox1" class="slide">
                    <button id="button3">Обновить выражение</button><br>
                    <textarea id="richTextBox1" virtualkeyboardpolicy="manual">y = sin(x^t)</textarea><br> <!-- rows="4" cols="30" -->
                    <div id="keyboard1" class="keyboard"></div>
                </div> <!-- groupBox1 -->
                
                <div id="groupBox2" class="slide">
                    <button id="button2">Обновить положение</button><br>
                
                    <div class="input-row">
                        <label>Масштаб:</label>
                        <input type="text" id="textBox1" value="5">
                    </div>
                
                    <div class="input-row">
                        <label>x:</label>
                        <input type="text" id="textBox2" value="0">
                    </div>
                
                   <div class="input-row">
                        <label>y:</label>
                        <input type="text" id="textBox3" value="0">
                    </div>
                    
                    <div class="input-row">
                        <label>t:</label>
                        <input type="text" id="textBox4" value="0">
                    </div>
                
                    <button id="button12">Вернуть положение по умолчанию</button><br>

                    <br><div id="label1">R: 0</div>
                </div> <!-- groupBox2 -->
                
                <div id="groupBox3" class="slide">
                    <input type="checkbox" id="checkBox1"><label for="checkBox1">Скрыть кнопки масштабирования</label><br>
                    <input type="checkbox" id="checkBox2"><label for="checkBox2">Скрыть отображение координат в левом верхнем углу</label><br>
                    <input type="checkbox" id="checkBox3"><label for="checkBox3">Скрыть кнопки в левом нижнем углу</label><br>
                    <input type="checkbox" id="checkBox4"><label for="checkBox4">Скрыть координатную сетку</label><br>
                    <input type="checkbox" id="checkBox5"><label for="checkBox5">Показывать FPS</label><br>
                    
                    <br><label>шаг t:</label>
                    <div class="input-row">
                        <input type="text" id="textBox6" value="0.025">
                        <button id="button14">Задать</button>
                        <button id="button15">Сбросить</button>
                    </div>
                    
                    <br><label>разрешение анимации:</label>
                    <div class="input-row">
                        <input type="text" id="textBox7" value="175">
                        <button id="button16">Задать</button>
                        <button id="button17">Сбросить</button>
                    </div>
                    
                    <br><label>высота меню:</label>
                    <div class="input-row">
                        <input type="text" id="textBox8" value="300">
                        <button id="button18">Задать</button>
                        <button id="button19">Сбросить</button>
                    </div>
                </div> <!-- groupBox3 -->
                
                <div id="groupBox4" class="slide">
                    <textarea id="richTextBox2" virtualkeyboardpolicy="manual">2+3</textarea><br>
                    <label>Результат:</label><br>
                    <input type="text" id="textBox5" value="5"><br>
                    <div id="keyboard2" class="keyboard"></div>
                </div> <!-- groupBox4 -->
            </div> <!-- menuSlider -->
        </div> <!-- menuWindow -->
    </div> <!-- menu -->

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
